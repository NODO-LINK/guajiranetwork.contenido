name: APK Guajira Network

on:
  push:
    branches: [main]
    paths: ['_taller/android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        id: build
        continue-on-error: true
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -o pipefail
          bash _taller/android/build.sh 2>&1 | tee /tmp/build-log.txt

      - name: Publicar APK (o el registro del error) en apk/
        run: |
          mkdir -p apk
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            cp _taller/android/build/GuajiraNetwork.apk apk/GuajiraNetwork.apk
            rm -f apk/build-log.txt
            MSG="APK compilado #${{ github.run_number }}"
          else
            cp /tmp/build-log.txt apk/build-log.txt
            MSG="APK: error de compilación #${{ github.run_number }}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk
          git commit -m "$MSG" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin main && break; sleep $((i*3)); done
